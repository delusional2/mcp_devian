# Скопируй в config.toml и поправь под себя:
#   cp config.example.toml config.toml
# config.toml в git не попадает.

# Фильтры покупок: чужие адопты на DA и треды продаж на Toyhouse.
[filters]
# Что хочется купить (виды, стиль, художники). Пусто = показывать всё подряд.
keywords = []
# Что точно не надо (ищется в названии и тегах).
exclude = ["ych", "commission", "base", "f2u"]
# Какие лоты показывать: auction, ota, bta, flatsale, raffle, adopt, ych, commission
lot_types = ["auction", "ota", "bta", "flatsale", "raffle", "adopt"]
# Бюджет. Лоты дороже пропускаются (для аукционов считается SB). 0 = без лимита.
max_usd = 0
max_points = 0

[deviantart]
poll_minutes = 30
# Папки групп. Ссылку берёшь прямо из адресной строки, когда открыта папка группы:
#   https://www.deviantart.com/<группа>/gallery/<номер>/<название>
# Все папки группы покажет команда: mcp-devian da-folders <группа>
groups = [
    # { url = "https://www.deviantart.com/da-adopts/gallery/26780440/auctions", label = "da-adopts: аукционы" },
]
# Художники, за чьими галереями следить.
artists = []

[toyhouse]
poll_minutes = 45
# Доски форума: 13 = Adoption Center, 5866 = Design Marketplace, 71 = Art Marketplace
boards = [13, 5866]
pages_per_board = 2
# Тред считается живым, если в нём что-то было за последние N дней.
active_days = 5
# Что ты продаёшь (виды, стиль). По этим словам отбираются LF-треды,
# где ищут персов. Пусто = показывать все живые LF-треды.
lf_keywords = []
# Сколько первых постов новых LF-тредов дочитывать за один проход.
read_first_posts = 5
# Окно Chrome видно, пока бот читает форум (полминуты). Без окна Cloudflare
# не пускает, а проверку «я человек» проходишь ты сама, когда попросит.
headless = false

[notify]
macos = true
# Telegram: токен и chat id лучше положить в .env (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID).
telegram = false
